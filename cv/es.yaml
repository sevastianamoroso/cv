cv:
  name: Sebastian Amoroso
  headline: "Ingeniero Electrónico | Diseño y Desarrollo de Hardware | Mecatrónica & Modelado 3D | Firmware"
  location: CABA (Villa Crespo), Argentina
  email: sevastianamoroso@gmail.com
  social_networks:
    - network: GitHub
      username: sevastianamoroso

  sections:
    perfil_profesional:
      - "Ingeniero Electrónico graduado de la Universidad Nacional del Sur, enfocado en el diseño y desarrollo de hardware, integración mecatrónica y modelado 3D. Experiencia en diseño de circuitos electrónicos, diseño de piezas mecánicas y chapa metálica (sheet metal), y desarrollo de firmware para sistemas embebidos."
      - "Actualmente me desempeño en Pump Control como Especialista en Mecatrónica (con trayectoria previa en el área de Ingeniería en Diseño de Hardware), participando en el desarrollo integral de soluciones electrónicas y mecánicas para equipos de medición y control."

    experiencia_laboral:
      - company: Pump Control S.R.L.
        position: "Especialista en Mecatrónica (previo: Diseñador de Hardware)"
        location: Buenos Aires, Argentina
        start_date: 2026-02
        end_date: present
        summary: "Equipos de medición, control y telemetría para la industria petrolera y de combustibles."
        highlights:
          - "Diseño y desarrollo de arquitectura de hardware SOM (System-on-Module) + carrier board con conectividad celular y microcontrolador para telemetría industrial."
          - "Diseño y cálculo de placas electrónicas de control, fuentes de alimentación, etapas de filtrado y acondicionamiento de señales."
          - "Implementación y conexionado de interfaces de comunicación industrial y serie: RS-485, RS-232 y niveles TTL."
          - "Modelado 3D y diseño mecánico de soportes, bastidores y ensambles en chapa metálica (sheet metal) para montaje de electrónica en equipos."
          - "Selección técnica y especificación de gabinetes estancos industriales según requerimientos ambientales y de campo."
          - "Puesta en marcha en banco de prueba y desarrollo de firmware puntual asistido por herramientas de IA (Claude Code, Antigravity) para validación de hardware."

    proyectos_destacados:
      - name: Sistema de Telerrobótica con Mano Antropomórfica Impresa en 3D
        start_date: 2025
        end_date: present
        summary: "Proyecto Final de Carrera (DIEC - UNS) — ESP32, ESP-NOW, FreeRTOS, Impresión 3D, MPU6050, Filtro de Kalman."
        highlights:
          - "Desarrollo de un sistema telerrobótico para replicar movimientos de mano y muñeca humanas en tiempo real sobre una mano robótica antropomórfica impresa en 3D."
          - "Arquitectura inalámbrica punto a punto con dos nodos ESP32 comunicados mediante ESP-NOW (2.4 GHz, latencia < 5 ms, lazo de control a 50 Hz)."
          - "Sensado de flexión de dedos y orientación de muñeca (Pitch/Roll) con IMU MPU6050 filtrada mediante Filtro de Kalman y calibración interactiva en memoria Flash (NVS)."
          - "Firmware en C/C++ sobre FreeRTOS multitarea con protocolo binario estructurado y validación de tramas por checksum Fletcher-16."
          - "Control PWM de servomotores con limitación de slew-rate para suavizado de trayectorias mecánicas y rutinas de failsafe ante pérdidas de señal."

    educación:
      - institution: Universidad Nacional del Sur
        area: Ingeniería Electrónica
        start_date: 2021
        end_date: present
        highlights:
          - "Ingeniero Electrónico — en curso, Proyecto Final en desarrollo (Telerrobótica, Sistemas Embebidos, ESP32)."

    habilidades_técnicas:
      - label: Diseño de Hardware y EDA
        details: "KiCad, Altium Designer, captura de esquemáticos, ruteo de PCBs multicapa, simulación en LTspice"
      - label: Diseño Mecánico y CAD 3D
        details: "Autodesk Inventor, FreeCAD, modelado de piezas mecánicas, chapa plegada (sheet metal), diseño de gabinetes y ensambles"
      - label: Firmware y Embebidos
        details: "C, C++, microcontroladores (STM32, ESP32), RTOS, Zephyr RTOS"
      - label: Protocolos y Comunicación
        details: "UART, I2C, SPI, CAN bus, Modbus"
      - label: Instrumental y Laboratorio
        details: "Osciloscopio, analizador lógico, estaciones de soldadura, pruebas y depuración de placas en banco"
      - label: Herramientas y Metodologías
        details: "Git, desarrollo asistido por herramientas de IA (Claude Code, Antigravity)"

    idiomas:
